    <title>InstacastPlus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container { text-align: center; max-width: 400px; }
        .icon {
            width: 120px; height: 120px;
            border-radius: 27px;
            margin: 0 auto 24px;
            overflow: hidden;
        }
        .icon img { width: 100%; height: 100%; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { font-size: 17px; color: #999; margin-bottom: 32px; }
        .open-app-button {
            display: inline-block; background: #E8520A; color: #fff;
            text-decoration: none; font-size: 17px; font-weight: 600;
            padding: 14px 32px; border-radius: 12px; transition: opacity 0.2s;
            margin-bottom: 12px;
        }
        .open-app-button:hover { opacity: 0.85; }
        .app-store-button {
            display: inline-block; background: #333; color: #fff;
            text-decoration: none; font-size: 15px; font-weight: 500;
            padding: 10px 24px; border-radius: 12px; transition: opacity 0.2s;
        }
        .app-store-button:hover { opacity: 0.85; }
        .fallback { margin-top: 16px; font-size: 13px; color: #666; }
    </style>
</head>
